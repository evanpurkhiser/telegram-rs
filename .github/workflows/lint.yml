name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gperf \
            clang \
            pkg-config \
            libssl-dev \
            zlib1g-dev

      - uses: jdx/mise-action@v4.2.0
      - run: prek run --all-files
